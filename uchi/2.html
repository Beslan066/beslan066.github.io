        .content-item video {
            max-width: 350px;
            margin-right: 20px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .content-item img:hover {
            transform: scale(1.02);
        }

        /* Стили для модального окна с изображением */
        .modal-image {
            max-width: 100%;
            max-height: 80vh;
            width: auto;
            height: auto;
        }

        .modal-content {
            background-color: transparent;
            border: none;
        }

        .modal-header {
            border-bottom: none;
            padding: 0.5rem 1rem;
        }

        .modal-header .btn-close {
            background-color: white;
            opacity: 1;
            padding: 0.5rem;

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.min.js"

        crossorigin="anonymous"></script>

    <script>
        function openModal(imgElement) {
            // Устанавливаем источник изображения в модальном окне
            document.getElementById('modalImage').src = imgElement.src;
            document.getElementById('modalImage').alt = imgElement.alt;
        }

        // Дополнительно: возможность закрывать модальное окно по клику на изображение
        document.getElementById('modalImage').addEventListener('click', function () {
            var modal = bootstrap.Modal.getInstance(document.getElementById('imageModal'));
            modal.hide();
        });

        // Дополнительно: навигация стрелками клавиатуры
        document.addEventListener('keydown', function (event) {
            var modal = document.getElementById('imageModal');
            if (modal.classList.contains('show')) {
                if (event.key === 'Escape') {
                    var bsModal = bootstrap.Modal.getInstance(modal);
                    bsModal.hide();
                }
            }
        });
    </script>
